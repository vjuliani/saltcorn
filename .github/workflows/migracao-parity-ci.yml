name: migracao-parity-ci
on:
  push:
    branches: [master]
    paths:
      - 'migracao/**'
      - 'packages/saltcorn-mobile-app/src/**'
      - 'docs/migracao-go/inventario/**'
      - '.github/workflows/migracao-parity-ci.yml'
  pull_request:
    paths:
      - 'migracao/**'
      - 'packages/saltcorn-mobile-app/src/**'
      - 'docs/migracao-go/inventario/**'
      - '.github/workflows/migracao-parity-ci.yml'
permissions:
  contents: read
jobs:
  parity-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: parity_ci_only
          POSTGRES_DB: go033_parity
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d go033_parity"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      SALTCORN_PARITY_DISPOSABLE: '1'
      SALTCORN_GO_TEST_DATABASE_URL: postgres://postgres:parity_ci_only@127.0.0.1:5432/go033_parity
      SALTCORN_GO_TEST_DATABASE_URL_RLS: postgres://parity_user:parity_test_only@127.0.0.1:5432/go033_parity
      SALTCORN_GO_TEST_INSTALLATION_DATABASE_URL: postgres://postgres:parity_ci_only@127.0.0.1:5432/go033_parity
      SALTCORN_GO_TEST_MOBILE_E2E: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: migracao/backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ferramentas e navegadores
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0
          npm ci --prefix migracao/e2e
          cd migracao/e2e
          npx playwright install --with-deps chromium firefox
      - name: Fixture exclusiva PG e RLS sem privilégios
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGDATABASE: go033_parity
          PGPASSWORD: parity_ci_only
        run: psql -X -v ON_ERROR_STOP=1 -f migracao/parity/fixture.sql
      - name: Gates rejeitam ausência de evidência
        run: python3 -m unittest discover -s migracao/parity -p 'test_*.py' -v
      - name: Executar toda a matriz e publicar lacunas
        run: python3 migracao/parity/run.py --output "$RUNNER_TEMP/go033-parity" --gate audit
      - name: Resumo de paridade (não autoriza promoção)
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/go033-parity/RESULTS.md" ]; then
            cat "$RUNNER_TEMP/go033-parity/RESULTS.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go033-parity-evidence
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/go033-parity/*.json
            ${{ runner.temp }}/go033-parity/*.log
            ${{ runner.temp }}/go033-parity/*.md
