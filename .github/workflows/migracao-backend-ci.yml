name: migracao-backend-ci

on:
  push:
    branches: [master]
    paths:
      - "migracao/backend/**"
      - ".github/workflows/migracao-backend-ci.yml"
  pull_request:
    paths:
      - "migracao/backend/**"
      - ".github/workflows/migracao-backend-ci.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: migracao/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: migracao/backend/go.mod
      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "Arquivos fora do padrão gofmt:"
            echo "$fmt_out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test -race
        run: go test -race -count=1 ./...
