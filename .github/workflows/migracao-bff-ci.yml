name: migracao-bff-ci

on:
  push:
    branches: [master]
    paths:
      - "migracao/packages/bff/**"
      - "migracao/contracts/gen/ts/**"
      - ".github/workflows/migracao-bff-ci.yml"
  pull_request:
    paths:
      - "migracao/packages/bff/**"
      - "migracao/contracts/gen/ts/**"
      - ".github/workflows/migracao-bff-ci.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: migracao/packages/bff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: typecheck
        run: npm run typecheck
      # npm test roda "build" (tsc) via pretest, depois node:test contra
      # dist/ — evita a resolução .js/.ts do type-stripping do Node, que
      # não remapeia extensões para módulos NodeNext (ver
      # docs/migracao-go/execucoes/GO-017.md).
      - name: build + test (node:test, mock do backend Go — sem Postgres real necessário)
        run: npm test
