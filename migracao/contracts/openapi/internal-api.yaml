openapi: 3.1.0
info:
  title: Saltcorn Go — API interna (BFF → Go)
  version: "0.1.0"
  description: >
    Contrato consumido pelo BFF Node.js (ADR-0003) — nunca diretamente pelo
    navegador — e, em versões futuras, por integrações externas autorizadas
    via API pública própria. Cobre o exemplo de CQRS de registros dinâmicos
    definido em ADR-0001 (`CreateRecord`/`ListRecords`) como recorte inicial
    representativo: não é a superfície completa do domínio, que ainda não
    existe em Go (ver docs/migracao-go/execucoes/GO-006.md, nota de escopo).
servers:
  - url: http://localhost:8090
    description: cmd/server local (GO-005)
security:
  - ServiceIdentity: []

paths:
  /v1/tenants/{tenant}/sync/{table}/exchange:
    parameters:
      - name: tenant
        in: path
        required: true
        schema: {type: string}
      - name: table
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: exchangeOfflineSync
      summary: Sincroniza alterações offline com conflitos explícitos e snapshot autorizado
      description: >
        GO-031, protocolo 1, independente do sync legado. Mesma operação/ID é
        idempotente; reutilizar ID com outro conteúdo retorna 409. Scope deve
        corresponder à sessão/identidade autenticada. Erros HTTP revertem o lote.
        Conflitos de registro retornam resultados explícitos em 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./sync.yaml#/components/schemas/Request"
      responses:
        "200":
          description: Resultados idempotentes e snapshot completo para persistência atômica local
          content:
            application/json:
              schema:
                $ref: "./sync.yaml#/components/schemas/Response"
        "400":
          description: Protocolo ou corpo inválido
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "401":
          description: Sessão ou identidade inválida
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "403":
          description: Scope, papel ou CSRF inválido
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "404":
          description: Tabela indisponível
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "409":
          description: Schema alterado ou ID reutilizado
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "413":
          description: Corpo ou snapshot acima do limite
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "502":
          description: Falha no domínio
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "503":
          description: Serviço indisponível
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"

  /healthz:
    get:
      operationId: getLiveness
      summary: Liveness (GO-005)
      security: []
      responses:
        "200":
          description: processo vivo

  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness (GO-005)
      security: []
      responses:
        "200":
          description: pronto para tráfego
        "503":
          description: ainda não pronto

  /v1/tenants/{tenant}/actor:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Tenant"
    get:
      operationId: getActor
      summary: "Query: papel atual do ator da identidade delegada"
      description: >
        Adicionado por GO-017 para o BFF resolver papel/permissões atuais a
        cada requisição (ADR-0007) em vez de confiar num valor cacheado na
        sessão de navegador — uma mudança de papel ou revogação de acesso
        vale a partir desta consulta, nunca de um valor antigo guardado
        alhures. `id`/`role_id` são resolvidos do `sub` do token, não de
        parâmetro algum — não é possível consultar o ator de outra pessoa.
      responses:
        "503":
          description: Capacidade temporariamente esgotada (service_unavailable); Retry-After em segundos
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "200":
          description: papel atual do ator autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Actor"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
    patch:
      operationId: setActorLanguage
      summary: "Command: define a preferência de idioma do ator autenticado"
      description: >
        GO-047 — self-service: o ator muda a PRÓPRIA preferência de
        idioma (`identity.User.Language`), nunca a de outro usuário —
        `id` vem do `sub` do token, nunca de um parâmetro, mesma garantia
        de `getActor` acima. `language` vazio ou ausente LIMPA a
        preferência (volta ao fallback de `default_locale` do tenant).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                language:
                  type: string
                  description: Código de locale curto (ex. "pt", "en") ou "" para limpar a preferência.
      responses:
        "503":
          description: Capacidade temporariamente esgotada (service_unavailable); Retry-After em segundos
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "200":
          description: preferência de idioma atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Actor"
        "400":
          description: corpo inválido
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /v1/tenants/{tenant}/tables:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Tenant"
    post:
      operationId: createTable
      summary: "Command: cria uma tabela dinâmica"
      description: >
        Adicionado por GO-019 — `internal/metadata.CreateTable` (GO-011)
        nunca tinha exposição HTTP. Sem Idempotency-Key: já é idempotente
        por definição própria (uma definição idêntica a uma já existente é
        um no-op bem-sucedido).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableInput"
      responses:
        "503":
          description: Capacidade temporariamente esgotada (service_unavailable); Retry-After em segundos
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "201":
          description: tabela criada (ou já existente, idempotente)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /v1/tenants/{tenant}/tables/{table}/fields:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Tenant"
      - name: table
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: addField
      summary: "Command: adiciona um campo a uma tabela dinâmica"
      description: Adicionado por GO-019 — `internal/metadata.AddField` (GO-011) nunca tinha exposição HTTP. Idempotente pela mesma razão de createTable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldInput"
      responses:
        "503":
          description: Capacidade temporariamente esgotada (service_unavailable); Retry-After em segundos
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "201":
          description: campo criado (ou já existente, idempotente)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Field"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /v1/tenants/{tenant}/views:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Tenant"
    get:
      operationId: listViews
      summary: "Query: lista views"
      description: >
        Adicionado por GO-020 — a página administrativa de views (frontend)
        precisa enumerar o que existe antes de abrir uma view individual.
        `table` filtra por tabela; omitido lista todas as views visíveis ao
        ator (mesmo filtro por papel de getView/updateView — nunca revela
        uma view não publicada a um ator sem papel suficiente).
      parameters:
        - name: table
          in: query
          schema:
            type: string
      responses:
        "503":
          description: Capacidade temporariamente esgotada (service_unavailable); Retry-After em segundos
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "200":
          description: views visíveis ao ator
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/View"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
    post:
      operationId: createView
      summary: "Command: cria uma view (documento de layout do editor)"
      description: >
        Adicionado por GO-019 — persiste o documento que o editor Craft.js
        (GO-018) produz (`craftToSaltcorn`). Nasce com MinRole = admin
        (nunca publicada por omissão); publicar é um `updateView` baixando
        `min_role`. Idempotente por Idempotency-Key (ao contrário de
        createTable/addField, uma view não é idempotente por definição
        própria — duas criações com o mesmo nome sem isso colidiriam em
        `duplicate_name` num retry legítimo).
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewInput"
      responses:
        "503":
          description: Capacidade temporariamente esgotada (service_unavailable); Retry-After em segundos
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "201":
          description: view criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/View"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./common.yaml#/components/responses/IdempotencyConflict"

  /v1/tenants/{tenant}/views/{id}:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Tenant"
      - name: id
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Id"
    get:
      operationId: getView
      summary: "Query: reabre uma view"
      description: O papel do ator é resolvido de novo a cada chamada — uma view despublicada nega a leitura seguinte sem nenhum resquício da anterior (mesmo espírito de GO-015).
      responses:
        "503":
          description: Capacidade temporariamente esgotada (service_unavailable); Retry-After em segundos
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "200":
          description: view encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/View"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          description: view não encontrada
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
    patch:
      operationId: updateView
      summary: "Command: salva ou publica uma view"
      description: >
        A mesma operação serve para "salvar" (corpo com `configuration`
        nova) e "publicar" (corpo com `min_role` menor) — só campos
        diferentes do mesmo PATCH. Exige `_version` (o `_version` de uma
        leitura anterior) para controle de concorrência otimista: se a
        view mudou desde a leitura, 409 — "conflito de edição é
        apresentado sem sobrescrever silenciosamente" (critério de aceite
        de GO-019). Idempotente por Idempotency-Key. Desde GO-020, publicar
        (resultar num `min_role` que não seja admin-only) exige que o
        layout seja executável pelo runtime novo — 422 caso contrário
        ("layouts incompatíveis bloqueiam publicação", critério de aceite
        de GO-020).
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewUpdateInput"
      responses:
        "503":
          description: Capacidade temporariamente esgotada (service_unavailable); Retry-After em segundos
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "200":
          description: view atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/View"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          description: conflito de versão otimista (edição concorrente) ou de idempotência
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "422":
          description: >
            layout incompatível com o runtime de renderização — só ao
            tentar publicar (min_role não admin-only); editar mantendo
            admin-only nunca é bloqueado.
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
              example:
                error:
                  code: view_unsupported
                  message: "template \"Feed\" não suportado neste runtime (só \"List\", \"Show\", \"Edit\")"

  /v1/tenants/{tenant}/views/{id}/render:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Tenant"
      - name: id
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Id"
    get:
      operationId: renderView
      summary: "Query: renderiza uma view List, Show ou Edit"
      description: >
        Adicionado por GO-020 (só "List"), estendido por GO-039 ("Show" e
        "Edit"). Não devolve HTML; devolve o DTO que o BFF/React desenham
        — o shape exato depende do `template` da view (ver
        `ViewRenderPlan`/`ViewShowPlan`/`ViewEditPlan`). `?record=` é
        OBRIGATÓRIO para "Show" (400 sem ele), OPCIONAL para "Edit"
        (ausente = registro novo, formulário de criação em branco), e
        ignorado por "List". Qualquer view fora do subconjunto suportado
        (ver `docs/migracao-go/execucoes/GO-020.md`/`GO-039.md` — ex.:
        template "Feed", coluna de layout não reconhecida, fieldview
        "upload") devolve 422, nunca uma renderização parcial. A
        autorização da view (`min_role`) e da tabela por baixo
        (`min_role_read`, GO-015) são checagens independentes — publicar
        uma view não contorna o papel mínimo de leitura da própria
        tabela.
      parameters:
        - $ref: "./common.yaml#/components/parameters/Cursor"
        - $ref: "./common.yaml#/components/parameters/Limit"
        - name: record
          in: query
          required: false
          schema:
            $ref: "./common.yaml#/components/schemas/Id"
          description: Id do registro — obrigatório para Show, opcional para Edit (ausente = registro novo), ignorado por List.
      responses:
        "503":
          description: Capacidade temporariamente esgotada (service_unavailable); Retry-After em segundos
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "200":
          description: plano de renderização — o shape exato depende do template da view
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ViewRenderPlan"
                  - $ref: "#/components/schemas/ViewShowPlan"
                  - $ref: "#/components/schemas/ViewEditPlan"
        "400":
          description: "?record= ausente (template Show) ou inválido"
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          description: view ou registro não encontrado
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "422":
          description: view existe, mas usa um recurso fora do subconjunto suportado por este runtime
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
              example:
                error:
                  code: view_unsupported
                  message: "configuration.columns ausente ou não é uma lista"

  /v1/tenants/{tenant}/views/{id}/submit:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Tenant"
      - name: id
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Id"
    post:
      operationId: submitView
      summary: "Command: form_action — cria/atualiza um registro de uma view Edit (GO-039)"
      description: >
        O mecanismo real por trás do botão "Salvar"/"SubmitWithAjax" do
        legado (`base-plugin/actions.ts`) — as duas ações do legado mapeiam
        para esta MESMA rota (só o estilo de requisição do frontend
        difere). `record_id` ausente/0 cria (`tryInsertRow`); presente
        exige `_version` e atualiza (`tryUpdateRow`), com o mesmo controle
        de concorrência otimista de qualquer outra escrita. `values` só
        pode conter campos que a própria view expõe (422 caso contrário —
        nunca aceita um campo extra fora do formulário). Devolve o
        registro resultante e `navigate` — a decisão de para onde ir
        depois (`destination_type` do legado): "reload" (padrão),
        "referer" (`Back to referer`) ou "view" (`View`, com `view_name`).
        Idempotente por Idempotency-Key.
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewSubmitInput"
      responses:
        "503":
          description: Capacidade temporariamente esgotada (service_unavailable); Retry-After em segundos
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "200":
          description: registro atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewSubmitResult"
        "201":
          description: registro criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewSubmitResult"
        "400":
          description: corpo inválido, Idempotency-Key ausente, ou _version ausente ao atualizar
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          description: view ou registro não encontrado
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "409":
          description: conflito de versão otimista, de idempotência, ou valor duplicado
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "422":
          description: view existe, mas o layout ou os campos submetidos não são suportados
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
              example:
                error:
                  code: view_unsupported
                  message: "campo \"extra\" não faz parte desta view"

  /v1/tenants/{tenant}/views/{id}/rows/{recordId}:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Tenant"
      - name: id
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Id"
      - name: recordId
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Id"
    delete:
      operationId: deleteViewRow
      summary: "Command: ação de coluna \"Delete\" de uma view List (GO-039)"
      description: >
        Só aceita um id de view cujo `configuration.columns` de fato
        declara uma coluna `Action`/`Delete` (422 caso contrário — nunca
        um atalho para deletar de qualquer view List). Confere o
        `minRole` do PRÓPRIO nó de coluna, além do `min_role_write` da
        tabela por baixo (internal/records) — duas checagens
        independentes. `?version=` é o mesmo `_version` de controle de
        concorrência otimista de qualquer outra escrita.
      parameters:
        - name: version
          in: query
          required: true
          schema:
            type: string
      responses:
        "503":
          description: Capacidade temporariamente esgotada (service_unavailable); Retry-After em segundos
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "204":
          description: linha excluída
        "400":
          description: "?version= ausente"
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          description: view ou registro não encontrado
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "409":
          description: conflito de versão otimista
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "422":
          description: view existe, mas não declara uma ação de coluna "Delete"
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"

  /v1/tenants/{tenant}/users:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Tenant"
    get:
      operationId: listUsers
      summary: "Query: lista usuários do tenant (admin)"
      description: >
        Adicionado por GO-044 — a administração de usuários do legado
        (`auth/admin.ts`) que faltava expor. Só um ator admin pode listar
        (`identity.ListUsers`); um ator sem papel suficiente recebe 403.
      responses:
        "200":
          description: usuários do tenant, em ordem de criação
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /v1/tenants/{tenant}/users/{id}:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Tenant"
      - name: id
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Id"
    patch:
      operationId: updateUser
      summary: "Command: muda o papel de um usuário (admin)"
      description: Só muda `role_id` — redefinir senha é uma rota própria (`reset-password`), de propósito, por ser mais sensível que um campo opcional de PATCH.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_id]
              properties:
                role_id:
                  type: integer
      responses:
        "204":
          description: papel atualizado
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          description: usuário não encontrado
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
    delete:
      operationId: deleteUser
      summary: "Command: remove um usuário (admin)"
      description: Idempotente — remover um usuário que não existe é sucesso silencioso (204), mesma convenção de deleteRecord.
      responses:
        "204":
          description: removido (ou já não existia)
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /v1/tenants/{tenant}/users/{id}/reset-password:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Tenant"
      - name: id
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Id"
    post:
      operationId: resetUserPassword
      summary: "Command: redefine a senha de um usuário (admin)"
      description: >
        `password` no corpo é opcional — omitido, o Go gera uma senha
        aleatória. A senha em texto plano só existe NESTA resposta, uma
        única vez (mesmo contrato do token de API) — o BFF/admin é
        responsável por entregá-la ao usuário por um canal seguro, nunca
        logá-la.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
      responses:
        "200":
          description: senha redefinida
          content:
            application/json:
              schema:
                type: object
                required: [password]
                properties:
                  password:
                    type: string
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          description: usuário não encontrado
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"

  /v1/tenants/{tenant}/users/{id}/tokens:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Tenant"
      - name: id
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Id"
    get:
      operationId: listUserTokens
      summary: "Query: lista tokens de API de um usuário (admin)"
      description: Nunca inclui o hash nem o texto plano do token — só id/created_at/revoked, para uma UI administrativa decidir o que revogar.
      responses:
        "200":
          description: tokens do usuário
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIToken"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /v1/tenants/{tenant}/users/{id}/impersonate:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Tenant"
      - name: id
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Id"
    post:
      operationId: startImpersonation
      summary: "Command: inicia uma impersonação auditada (admin)"
      description: >
        O admin é sempre o `sub` da identidade delegada, nunca um campo do
        corpo. Registra uma linha de auditoria (`_sc_impersonation_log`) —
        divergência deliberada e mais forte que o legado, que troca
        `req.user` sem deixar nenhum rastro. O BFF usa `log_id` para
        encerrar a impersonação depois; a sessão de navegador do usuário
        impersonado é sempre criada pelo BFF, nunca pelo Go (ADR-0007).
      responses:
        "201":
          description: impersonação iniciada
          content:
            application/json:
              schema:
                type: object
                required: [log_id, target_user_id]
                properties:
                  log_id:
                    $ref: "./common.yaml#/components/schemas/Id"
                  target_user_id:
                    $ref: "./common.yaml#/components/schemas/Id"
        "400":
          description: admin tentou impersonar a própria conta
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          description: usuário-alvo não encontrado
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"

  /v1/tenants/{tenant}/impersonations/{id}/end:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Tenant"
      - name: id
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Id"
    post:
      operationId: endImpersonation
      summary: "Command: encerra uma impersonação (sem checagem de papel)"
      description: >
        Exige `ServiceIdentity` válido para o tenant (como qualquer outra
        rota), mas deliberadamente SEM checagem de papel/ownership: quem
        chama isto é o BFF encerrando sua PRÓPRIA sessão de impersonação (o
        `log_id` só existe porque o BFF o guardou depois de um
        `startImpersonation` bem-sucedido), nunca um usuário final
        escolhendo um id de outra pessoa. Idempotente — encerrar um id
        já encerrado ou inexistente também devolve 204.
      responses:
        "204":
          description: encerrado (ou já estava encerrado/não existia)
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /v1/tenants/{tenant}/tables/{table}/permissions:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Tenant"
      - name: table
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateTablePermissions
      summary: "Command: muda min_role_read/min_role_write de uma tabela (admin)"
      description: >
        Adicionado por GO-044 — a UI "table-access"/"permissions" de
        `auth/admin.ts` do legado. `createTable` só define os mínimos na
        criação; esta rota é o único jeito de mudá-los depois.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [min_role_read, min_role_write]
              properties:
                min_role_read:
                  type: integer
                min_role_write:
                  type: integer
      responses:
        "200":
          description: tabela com permissões atualizadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          description: tabela não encontrada
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"

  /v1/tenants/{tenant}/realtime/events:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Tenant"
    get:
      operationId: listRealtimeEvents
      summary: "Query: eventos de tempo real pendentes de entrega ao ator autenticado"
      description: >
        Adicionado por GO-028 — o BFF Node.js (único lugar onde o
        protocolo Socket.IO de fato roda, ADR-0003/ADR-0007) faz polling
        curto desta rota, uma vez por socket conectado, para saber o que
        reemitir. O filtro por destinatário roda inteiramente aqui
        (`internal/realtime.ListSinceForActor`): a resposta já contém só
        os eventos que o `sub` do token deveria receber (broadcast do
        tenant + endereçados especificamente a ele), nunca eventos de
        outro usuário — o BFF não decide audience, só reemite o que
        recebe. `after` é o cursor de retomada opaco (o `next_after` de
        uma chamada anterior); omitido, lê desde o início da janela de
        retenção atual.
      parameters:
        - name: after
          in: query
          required: false
          description: Cursor de retomada — o `next_after` da chamada anterior. Omitir para a primeira chamada de uma conexão nova.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - $ref: "./common.yaml#/components/parameters/Limit"
      responses:
        "503":
          description: Capacidade temporariamente esgotada (service_unavailable); Retry-After em segundos
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "200":
          description: página de eventos endereçados ao ator autenticado, em ordem de publicação
          content:
            application/json:
              schema:
                type: object
                required: [items, next_after]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RealtimeEvent"
                  next_after:
                    type: integer
                    format: int64
                    description: Cursor a enviar como `after` na próxima chamada — igual ao `after` recebido quando `items` vem vazio.
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /v1/tenants/{tenant}/tables/{table}/records:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Tenant"
      - name: table
        in: path
        required: true
        description: Nome da tabela dinâmica (definida em tempo de execução pelo usuário final — GO-011).
        schema:
          type: string
    get:
      operationId: listRecords
      summary: "Query: lista registros de uma tabela dinâmica"
      description: >
        Aplica as mesmas políticas de visibilidade (papel, ownership, RLS)
        que os comandos de escrita — ADR-0001. Não executa ações de negócio.
      parameters:
        - $ref: "./common.yaml#/components/parameters/Cursor"
        - $ref: "./common.yaml#/components/parameters/Limit"
      responses:
        "503":
          description: Capacidade temporariamente esgotada (service_unavailable); Retry-After em segundos
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "200":
          description: página de registros
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Record"
              examples:
                positivo_identidade_valida:
                  summary: "Positivo: identidade delegada válida, tenant confere"
                  value:
                    items:
                      - id: 1
                        _version: "1"
                        name: "guitars"
                    next_cursor: null
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
    post:
      operationId: createRecord
      summary: "Command: cria um registro"
      description: >
        Valida tenant, ator, schema, tipos, ownership e triggers
        transacionais; grava o registro e o outbox na mesma transação
        (ADR-0001). Idempotente por Idempotency-Key.
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordInput"
      responses:
        "503":
          description: Capacidade temporariamente esgotada (service_unavailable); Retry-After em segundos
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "201":
          description: registro criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./common.yaml#/components/responses/IdempotencyConflict"

  /v1/tenants/{tenant}/tables/{table}/records/{id}:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Tenant"
      - name: table
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Id"
    get:
      operationId: getRecord
      summary: "Query: busca um registro por ID"
      responses:
        "503":
          description: Capacidade temporariamente esgotada (service_unavailable); Retry-After em segundos
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "200":
          description: registro encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          description: registro não encontrado (ou fora da visibilidade do ator — nunca distingue os dois casos na resposta)
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
    patch:
      operationId: updateRecord
      summary: "Command: atualiza campos de um registro"
      description: >
        Adicionado por GO-040 — o desenho original (GO-006) já reservava
        esta rota, mas nunca definia como o cliente transmitiria a versão
        esperada (nem `_version` no corpo, nem `If-Match`), apesar do 409
        de conflito já documentado; corrigido aqui. `_version` (de uma
        leitura anterior, ex.: `getRecord`/`listRecords`) é OBRIGATÓRIO —
        mesma convenção de `_version` em `ViewUpdateInput`/
        `ViewSubmitInput`. Campos ausentes do corpo permanecem inalterados
        (nunca um PUT que sobrescreve o registro inteiro); mesmo controle
        de concorrência otimista de qualquer outra escrita — 409 se o
        registro mudou desde a leitura. Idempotente por Idempotency-Key
        (retry com a mesma chave e o mesmo corpo reaproveita o resultado,
        nunca reaplica a escrita duas vezes).
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordUpdateInput"
      responses:
        "503":
          description: Capacidade temporariamente esgotada (service_unavailable); Retry-After em segundos
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "200":
          description: registro atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "400":
          description: corpo inválido, Idempotency-Key ausente, ou _version ausente
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          description: registro não encontrado
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "409":
          description: conflito de versão otimista ou de idempotência
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
    delete:
      operationId: deleteRecord
      summary: "Command: remove um registro"
      description: >
        Adicionado por GO-040 — mesma correção de `_version` de
        `updateRecord` acima. `?version=` é obrigatório (o `_version` de
        uma leitura anterior). Idempotente por natureza (não por
        Idempotency-Key, mesma convenção de `deleteViewRow` desde GO-039):
        remover um registro já removido devolve 404, um estado final
        consistente, não um efeito duplicado — por isso esta rota não
        exige o cabeçalho.
      parameters:
        - name: version
          in: query
          required: true
          schema:
            type: string
      responses:
        "503":
          description: Capacidade temporariamente esgotada (service_unavailable); Retry-After em segundos
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "204":
          description: removido
        "400":
          description: "?version= ausente"
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          description: registro não encontrado
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "409":
          description: conflito de versão otimista
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"

  /v1/tenants/{tenant}/tables/{table}/records/{id}/history:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Tenant"
      - name: table
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Id"
    get:
      operationId: getRecordHistory
      summary: "Query: lista os snapshots de versionamento de um registro"
      description: >
        GO-045 (`models/table.ts`, flag `versioned`) — só disponível para
        tabelas `versioned=true` (ver TableInput/Table); 409 caso
        contrário (nunca uma lista vazia ambígua entre "sem versões ainda"
        e "tabela nem tem histórico"). Ordem mais recente primeiro.
      responses:
        "503":
          description: Capacidade temporariamente esgotada (service_unavailable); Retry-After em segundos
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "200":
          description: snapshots do registro, mais recente primeiro
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecordHistoryVersion"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          description: tabela desconhecida
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "409":
          description: tabela não é versionada
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"

  /v1/tenants/{tenant}/tables/{table}/records/{id}/restore:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Tenant"
      - name: table
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Id"
    post:
      operationId: restoreRecordVersion
      summary: "Command: restaura um registro para um snapshot anterior"
      description: >
        GO-045 — restaurar é sempre ADITIVO: cria um NOVO snapshot no
        histórico (marcado `restore_of_version`, apontando para a versão
        restaurada), nunca apaga nem sobrescreve um snapshot existente.
        Mesmo controle de concorrência otimista de qualquer escrita — a
        versão ATUAL do registro (não a do histórico) é lida no momento da
        restauração; um 409 aqui significa que o registro mudou entre a
        leitura do histórico e esta chamada, não um conflito de
        snapshots.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: integer
                  description: "_history_version do snapshot a restaurar (ver getRecordHistory)."
      responses:
        "503":
          description: Capacidade temporariamente esgotada (service_unavailable); Retry-After em segundos
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "200":
          description: registro restaurado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "400":
          description: corpo inválido ou version ausente
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          description: tabela, registro ou snapshot não encontrado
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "409":
          description: tabela não é versionada, ou conflito de versão otimista no registro atual
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"

components:
  securitySchemes:
    ServiceIdentity:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Identidade delegada ator+tenant entre BFF e backend Go (ADR-0003). O
        BFF assina um JWT de vida curta com claims `{sub (ator), tenant, iat,
        exp}`; o Go valida assinatura, expiração, e que o claim `tenant` bate
        com o tenant da URL (ver schema Tenant em common.yaml). Nunca aceitar
        tenant vindo de um header solto — GO-001 §2.1, "identidade não pode
        ser forjada por headers". Exemplos completos (positivo e dois
        negativos) em ../fixtures/identidade-delegada.md.

  schemas:
    Actor:
      type: object
      required: [id, role_id, language, default_locale]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Id"
        role_id:
          type: integer
          description: Papel atual do ator (identity.RoleID) — nunca cacheado pelo chamador, sempre resolvido nesta consulta.
        language:
          type: string
          description: >
            GO-047 — preferência de idioma EXPLÍCITA do usuário
            (`identity.User.Language`). "" significa "sem preferência" —
            nunca um idioma padrão implícito; o BFF resolve o idioma
            efetivo (cookie `lang` > `default_locale`) quando vazio.
        default_locale:
          type: string
          description: >
            GO-047 — idioma padrão do TENANT (`internal/config`, chave
            `default_locale`), sempre preenchido (fallback `"pt"` quando
            o tenant nunca configurou), nunca vazio.

    User:
      type: object
      required: [id, role_id, email]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Id"
        role_id:
          type: integer
        email:
          type: string

    APIToken:
      type: object
      required: [id, created_at, revoked]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Id"
        created_at:
          type: string
        revoked:
          type: boolean

    TableInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        min_role_read:
          type: integer
        min_role_write:
          type: integer
        versioned:
          type: boolean
          description: >
            GO-045 — se true, toda escrita (insert/update) grava um
            snapshot em `<name>__history`, consultável via `GET
            .../records/{id}/history` e restaurável via `POST
            .../records/{id}/restore`. Omitido/false: tabela sem
            histórico, mesmo padrão de hoje.

    Table:
      type: object
      required: [id, name, min_role_read, min_role_write, versioned]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Id"
        name:
          type: string
        min_role_read:
          type: integer
        min_role_write:
          type: integer
        versioned:
          type: boolean

    FieldInput:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [text, integer, boolean, float, date, key]
        required:
          type: boolean
        unique:
          type: boolean
        references:
          type: string
          description: Nome da tabela referenciada — obrigatório quando type=key.

    Field:
      type: object
      required: [id, table_id, name, type]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Id"
        table_id:
          $ref: "./common.yaml#/components/schemas/Id"
        name:
          type: string
        type:
          type: string
        required:
          type: boolean
        unique:
          type: boolean
        references_table_id:
          $ref: "./common.yaml#/components/schemas/Id"

    ViewInput:
      type: object
      required: [name, table, template, configuration]
      properties:
        name:
          type: string
        table:
          type: string
          description: Nome da tabela (não o id) que a view consulta.
        template:
          type: string
          description: Identificador de intenção (ex. "List", "Show") — armazenado, não interpretado nesta versão (a renderização é GO-020).
        configuration:
          type: object
          additionalProperties: true
          description: O documento de layout produzido pelo builder Craft.js (`craftToSaltcorn`, GO-018).
        min_role:
          type: integer

    ViewUpdateInput:
      type: object
      required: [_version]
      properties:
        _version:
          type: string
          description: O `_version` de uma leitura anterior — obrigatório, mesmo quando só min_role está sendo alterado (publicar também é uma escrita sujeita a conflito).
        configuration:
          type: object
          additionalProperties: true
        template:
          type: string
        min_role:
          type: integer

    View:
      type: object
      required: [id, name, table_id, template, min_role, configuration, _version]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Id"
        name:
          type: string
        table_id:
          $ref: "./common.yaml#/components/schemas/Id"
        template:
          type: string
        min_role:
          type: integer
        configuration:
          type: object
          additionalProperties: true
        _version:
          type: string

    ViewRenderColumn:
      type: object
      required: [kind]
      description: >
        Uma coluna de uma view "List" (GO-020, estendida em GO-039) — três
        variantes discriminadas por `kind`: "field" (campo direto,
        `field_name` é o nome do campo), "join_field" (campo trazido por
        join de um nível, `field_name` é a chave composta
        "<campo_local>__<campo_remoto>" — a MESMA chave usada em `rows`),
        "action" (ação de coluna, ex.: "Delete" — não tem `field_name`,
        só `action_name`).
      properties:
        kind:
          type: string
          enum: [field, join_field, action]
        field_name:
          type: string
          description: Presente para kind=field/join_field — já resolvido contra o catálogo (GO-011), nunca inventado.
        header_label:
          type: string
        action_name:
          type: string
          description: 'Presente para kind=action (ex.: "Delete").'

    ViewRenderPlan:
      type: object
      required: [view_id, columns, rows, order_by, descending]
      description: >
        DTO de renderização de uma view "List" (GO-020) — todas as decisões
        (colunas, ordenação, consulta) já foram tomadas pelo backend; o
        BFF/React só desenham o que está aqui.
      properties:
        view_id:
          $ref: "./common.yaml#/components/schemas/Id"
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ViewRenderColumn"
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        order_by:
          type: string
        descending:
          type: boolean
        next_cursor:
          type: ["string", "null"]
          description: Cursor para a próxima página, ou `null` se não houver mais páginas.

    ViewShowPlan:
      type: object
      required: [view_id, table, record_id, columns, values]
      description: >
        DTO de renderização de uma view "Show" (GO-039) — os valores já
        resolvidos de UM registro.
      properties:
        view_id:
          $ref: "./common.yaml#/components/schemas/Id"
        table:
          type: string
        record_id:
          $ref: "./common.yaml#/components/schemas/Id"
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ViewRenderColumn"
        values:
          type: object
          additionalProperties: true

    ViewEditFieldOption:
      type: object
      required: [id, label]
      description: >
        Uma opção de um campo FieldKey (fieldview "select") — um registro
        candidato da tabela referenciada. `label` é o primeiro campo de
        texto dessa tabela (heurístico documentado, GO-039 — o legado
        permite configurar um "summary field" por relação, não reproduzido
        aqui).
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Id"
        label:
          type: string

    ViewEditField:
      type: object
      required: [field_name, label, field_type, fieldview, required, value]
      properties:
        field_name:
          type: string
        label:
          type: string
        field_type:
          type: string
          description: "Tipo do campo no catálogo (GO-011): text, integer, boolean, float, date, key."
        fieldview:
          type: string
          description: Hint de widget do legado (ex.; "edit", "select", "flatpickr") — o backend não interpreta, só repassa.
        required:
          type: boolean
        config:
          type: object
          additionalProperties: true
          description: 'Configuração específica da fieldview (ex.: `{"dateFormat": "Y-m-d H:i"}` de flatpickr), repassada sem interpretação.'
        value:
          description: Valor atual (registro existente) ou `null` (criação nova).
        options:
          type: array
          items:
            $ref: "#/components/schemas/ViewEditFieldOption"
          description: Presente só quando field_type=key e fieldview=select.

    ViewEditPlan:
      type: object
      required: [view_id, table, record_id, fields, action_name]
      description: >
        DTO de renderização/edição de uma view "Edit" (GO-039) —
        record_id=0 é o plano de CRIAÇÃO (todos os campos em branco).
      properties:
        view_id:
          $ref: "./common.yaml#/components/schemas/Id"
        table:
          type: string
        record_id:
          $ref: "./common.yaml#/components/schemas/Id"
        _version:
          type: string
          description: Ausente quando record_id=0 (registro novo).
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ViewEditField"
        action_name:
          type: string
          description: '"Save" ou "SubmitWithAjax".'

    ViewSubmitInput:
      type: object
      required: [values]
      properties:
        record_id:
          $ref: "./common.yaml#/components/schemas/Id"
        _version:
          type: string
          description: Obrigatório quando record_id está presente (atualização).
        values:
          type: object
          additionalProperties: true

    ViewNavigate:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [reload, referer, view]
        view_name:
          type: string
          description: Presente só quando type=view.

    ViewSubmitResult:
      type: object
      required: [record, navigate]
      properties:
        record:
          type: object
          additionalProperties: true
        navigate:
          $ref: "#/components/schemas/ViewNavigate"

    RealtimeEvent:
      type: object
      required: [id, audience, payload]
      properties:
        id:
          type: integer
          format: int64
          description: Cursor de ordenação — sempre crescente na ordem de publicação (nunca reordenar por outro campo).
        audience:
          type: string
          enum: [broadcast, users]
          description: >
            Informativo — o BFF não precisa decidir roteamento por
            audience, a filtragem por destinatário já aconteceu no
            backend (ver `listRealtimeEvents`).
        payload:
          type: object
          additionalProperties: true
          description: Corpo opaco definido por quem publicou o evento (ex. internal/notify.Create) — o BFF reemite tal como está, nunca reinterpreta.

    RecordInput:
      type: object
      additionalProperties: true
      description: >
        Campos do registro conforme o schema dinâmico da tabela (GO-011).
        Este contrato não pode enumerar campos fixos — validação de schema
        acontece no backend, não aqui.

    RecordUpdateInput:
      type: object
      required: [_version]
      description: >
        Adicionado por GO-040. `_version` é obrigatório mesmo quando só um
        campo está sendo alterado. Campos ausentes do corpo (além de
        `_version`) permanecem inalterados — nunca uma sobrescrita
        completa do registro.
      properties:
        _version:
          type: string
      additionalProperties: true

    Record:
      type: object
      required: [id, _version]
      description: >
        Corrigido em GO-040: o desenho original (GO-006) declarava
        `version` (integer) e `created_at`/`updated_at`, nenhum dos três
        jamais implementado — `internal/metadata` (GO-011) não grava
        colunas de auditoria em tabelas dinâmicas, e a versão otimista
        real (`internal/records`, GO-012/013) é `_version` (string,
        derivada de `xmin` no Postgres), o mesmo campo que `View`/
        `ViewUpdateInput` já usam. `listRecords`/`createRecord` (GO-017)
        sempre devolveram este shape real — o schema é quem estava
        desatualizado, não o comportamento.
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Id"
        _version:
          type: string
          description: Versão otimista do registro (ADR-0001) — usada para detectar escrita concorrente.
      additionalProperties: true

    RecordHistoryVersion:
      type: object
      required: [version, time, record]
      description: >
        GO-045 — um snapshot de `<table>__history`. `version` é
        `_history_version` (posição na linha do tempo do registro), nunca
        confundir com `_version`/xmin de Record (controle de concorrência
        otimista, um conceito distinto que o snapshot nem carrega).
      properties:
        version:
          type: integer
        time:
          type: string
          description: RFC3339 — quando este snapshot foi gravado.
        restore_of_version:
          type: integer
          description: Presente só quando este snapshot é o resultado de um restoreRecordVersion — a versão que foi restaurada.
        record:
          type: object
          description: Os campos de dados do registro naquele instante (nunca inclui id/_version — id já está no path, _version não existe no histórico).
          additionalProperties: true
