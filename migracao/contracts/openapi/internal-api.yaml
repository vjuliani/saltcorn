openapi: 3.1.0
info:
  title: Saltcorn Go — API interna (BFF → Go)
  version: "0.1.0"
  description: >
    Contrato consumido pelo BFF Node.js (ADR-0003) — nunca diretamente pelo
    navegador — e, em versões futuras, por integrações externas autorizadas
    via API pública própria. Cobre o exemplo de CQRS de registros dinâmicos
    definido em ADR-0001 (`CreateRecord`/`ListRecords`) como recorte inicial
    representativo: não é a superfície completa do domínio, que ainda não
    existe em Go (ver docs/migracao-go/execucoes/GO-006.md, nota de escopo).
servers:
  - url: http://localhost:8090
    description: cmd/server local (GO-005)
security:
  - ServiceIdentity: []

paths:
  /v1/tenants/{tenant}/sync/{table}/exchange:
    parameters:
      - name: tenant
        in: path
        required: true
        schema: {type: string}
      - name: table
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: exchangeOfflineSync
      summary: Sincroniza alterações offline com conflitos explícitos e snapshot autorizado
      description: >
        GO-031, protocolo 1, independente do sync legado. Mesma operação/ID é
        idempotente; reutilizar ID com outro conteúdo retorna 409. Scope deve
        corresponder à sessão/identidade autenticada. Erros HTTP revertem o lote.
        Conflitos de registro retornam resultados explícitos em 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./sync.yaml#/components/schemas/Request"
      responses:
        "200":
          description: Resultados idempotentes e snapshot completo para persistência atômica local
          content:
            application/json:
              schema:
                $ref: "./sync.yaml#/components/schemas/Response"
        "400":
          description: Protocolo ou corpo inválido
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "401":
          description: Sessão ou identidade inválida
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "403":
          description: Scope, papel ou CSRF inválido
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "404":
          description: Tabela indisponível
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "409":
          description: Schema alterado ou ID reutilizado
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "413":
          description: Corpo ou snapshot acima do limite
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "502":
          description: Falha no domínio
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "503":
          description: Serviço indisponível
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"

  /healthz:
    get:
      operationId: getLiveness
      summary: Liveness (GO-005)
      security: []
      responses:
        "200":
          description: processo vivo

  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness (GO-005)
      security: []
      responses:
        "200":
          description: pronto para tráfego
        "503":
          description: ainda não pronto

  /v1/tenants/{tenant}/actor:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Tenant"
    get:
      operationId: getActor
      summary: "Query: papel atual do ator da identidade delegada"
      description: >
        Adicionado por GO-017 para o BFF resolver papel/permissões atuais a
        cada requisição (ADR-0007) em vez de confiar num valor cacheado na
        sessão de navegador — uma mudança de papel ou revogação de acesso
        vale a partir desta consulta, nunca de um valor antigo guardado
        alhures. `id`/`role_id` são resolvidos do `sub` do token, não de
        parâmetro algum — não é possível consultar o ator de outra pessoa.
      responses:
        "200":
          description: papel atual do ator autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Actor"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /v1/tenants/{tenant}/tables:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Tenant"
    post:
      operationId: createTable
      summary: "Command: cria uma tabela dinâmica"
      description: >
        Adicionado por GO-019 — `internal/metadata.CreateTable` (GO-011)
        nunca tinha exposição HTTP. Sem Idempotency-Key: já é idempotente
        por definição própria (uma definição idêntica a uma já existente é
        um no-op bem-sucedido).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableInput"
      responses:
        "201":
          description: tabela criada (ou já existente, idempotente)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /v1/tenants/{tenant}/tables/{table}/fields:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Tenant"
      - name: table
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: addField
      summary: "Command: adiciona um campo a uma tabela dinâmica"
      description: Adicionado por GO-019 — `internal/metadata.AddField` (GO-011) nunca tinha exposição HTTP. Idempotente pela mesma razão de createTable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldInput"
      responses:
        "201":
          description: campo criado (ou já existente, idempotente)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Field"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /v1/tenants/{tenant}/views:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Tenant"
    get:
      operationId: listViews
      summary: "Query: lista views"
      description: >
        Adicionado por GO-020 — a página administrativa de views (frontend)
        precisa enumerar o que existe antes de abrir uma view individual.
        `table` filtra por tabela; omitido lista todas as views visíveis ao
        ator (mesmo filtro por papel de getView/updateView — nunca revela
        uma view não publicada a um ator sem papel suficiente).
      parameters:
        - name: table
          in: query
          schema:
            type: string
      responses:
        "200":
          description: views visíveis ao ator
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/View"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
    post:
      operationId: createView
      summary: "Command: cria uma view (documento de layout do editor)"
      description: >
        Adicionado por GO-019 — persiste o documento que o editor Craft.js
        (GO-018) produz (`craftToSaltcorn`). Nasce com MinRole = admin
        (nunca publicada por omissão); publicar é um `updateView` baixando
        `min_role`. Idempotente por Idempotency-Key (ao contrário de
        createTable/addField, uma view não é idempotente por definição
        própria — duas criações com o mesmo nome sem isso colidiriam em
        `duplicate_name` num retry legítimo).
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewInput"
      responses:
        "201":
          description: view criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/View"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./common.yaml#/components/responses/IdempotencyConflict"

  /v1/tenants/{tenant}/views/{id}:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Tenant"
      - name: id
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Id"
    get:
      operationId: getView
      summary: "Query: reabre uma view"
      description: O papel do ator é resolvido de novo a cada chamada — uma view despublicada nega a leitura seguinte sem nenhum resquício da anterior (mesmo espírito de GO-015).
      responses:
        "200":
          description: view encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/View"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          description: view não encontrada
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
    patch:
      operationId: updateView
      summary: "Command: salva ou publica uma view"
      description: >
        A mesma operação serve para "salvar" (corpo com `configuration`
        nova) e "publicar" (corpo com `min_role` menor) — só campos
        diferentes do mesmo PATCH. Exige `_version` (o `_version` de uma
        leitura anterior) para controle de concorrência otimista: se a
        view mudou desde a leitura, 409 — "conflito de edição é
        apresentado sem sobrescrever silenciosamente" (critério de aceite
        de GO-019). Idempotente por Idempotency-Key. Desde GO-020, publicar
        (resultar num `min_role` que não seja admin-only) exige que o
        layout seja executável pelo runtime novo — 422 caso contrário
        ("layouts incompatíveis bloqueiam publicação", critério de aceite
        de GO-020).
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewUpdateInput"
      responses:
        "200":
          description: view atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/View"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          description: conflito de versão otimista (edição concorrente) ou de idempotência
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "422":
          description: >
            layout incompatível com o runtime de renderização — só ao
            tentar publicar (min_role não admin-only); editar mantendo
            admin-only nunca é bloqueado.
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
              example:
                error:
                  code: view_unsupported
                  message: "template \"Show\" não suportado neste runtime (só \"List\")"

  /v1/tenants/{tenant}/views/{id}/render:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Tenant"
      - name: id
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Id"
    get:
      operationId: renderView
      summary: "Query: renderiza uma view List (GO-020)"
      description: >
        Adicionado por GO-020 — não devolve HTML; devolve o DTO (colunas
        resolvidas contra o catálogo + linhas + paginação) que o BFF/React
        desenham. Subconjunto suportado desta tarefa: só o template "List",
        com colunas de campo direto (ver `docs/migracao-go/execucoes/GO-020.md`);
        qualquer view fora desse subconjunto devolve 422, nunca uma
        renderização parcial. A autorização da view (`min_role`) e da
        tabela por baixo (`min_role_read`, GO-015) são checagens
        independentes — publicar uma view não contorna o papel mínimo de
        leitura da própria tabela.
      parameters:
        - $ref: "./common.yaml#/components/parameters/Cursor"
        - $ref: "./common.yaml#/components/parameters/Limit"
      responses:
        "200":
          description: plano de renderização (colunas + linhas + paginação)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewRenderPlan"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          description: view não encontrada
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "422":
          description: view existe, mas usa um recurso fora do subconjunto suportado por este runtime
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
              example:
                error:
                  code: view_unsupported
                  message: "layout.besides ausente ou não é uma lista — só layouts de lista de colunas são suportados"

  /v1/tenants/{tenant}/realtime/events:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Tenant"
    get:
      operationId: listRealtimeEvents
      summary: "Query: eventos de tempo real pendentes de entrega ao ator autenticado"
      description: >
        Adicionado por GO-028 — o BFF Node.js (único lugar onde o
        protocolo Socket.IO de fato roda, ADR-0003/ADR-0007) faz polling
        curto desta rota, uma vez por socket conectado, para saber o que
        reemitir. O filtro por destinatário roda inteiramente aqui
        (`internal/realtime.ListSinceForActor`): a resposta já contém só
        os eventos que o `sub` do token deveria receber (broadcast do
        tenant + endereçados especificamente a ele), nunca eventos de
        outro usuário — o BFF não decide audience, só reemite o que
        recebe. `after` é o cursor de retomada opaco (o `next_after` de
        uma chamada anterior); omitido, lê desde o início da janela de
        retenção atual.
      parameters:
        - name: after
          in: query
          required: false
          description: Cursor de retomada — o `next_after` da chamada anterior. Omitir para a primeira chamada de uma conexão nova.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - $ref: "./common.yaml#/components/parameters/Limit"
      responses:
        "200":
          description: página de eventos endereçados ao ator autenticado, em ordem de publicação
          content:
            application/json:
              schema:
                type: object
                required: [items, next_after]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RealtimeEvent"
                  next_after:
                    type: integer
                    format: int64
                    description: Cursor a enviar como `after` na próxima chamada — igual ao `after` recebido quando `items` vem vazio.
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"

  /v1/tenants/{tenant}/tables/{table}/records:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Tenant"
      - name: table
        in: path
        required: true
        description: Nome da tabela dinâmica (definida em tempo de execução pelo usuário final — GO-011).
        schema:
          type: string
    get:
      operationId: listRecords
      summary: "Query: lista registros de uma tabela dinâmica"
      description: >
        Aplica as mesmas políticas de visibilidade (papel, ownership, RLS)
        que os comandos de escrita — ADR-0001. Não executa ações de negócio.
      parameters:
        - $ref: "./common.yaml#/components/parameters/Cursor"
        - $ref: "./common.yaml#/components/parameters/Limit"
      responses:
        "200":
          description: página de registros
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Record"
              examples:
                positivo_identidade_valida:
                  summary: "Positivo: identidade delegada válida, tenant confere"
                  value:
                    items:
                      - id: 1
                        version: 1
                        created_at: "2026-01-15T00:00:00Z"
                        updated_at: "2026-01-15T00:00:00Z"
                        name: "guitars"
                    next_cursor: null
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
    post:
      operationId: createRecord
      summary: "Command: cria um registro"
      description: >
        Valida tenant, ator, schema, tipos, ownership e triggers
        transacionais; grava o registro e o outbox na mesma transação
        (ADR-0001). Idempotente por Idempotency-Key.
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordInput"
      responses:
        "201":
          description: registro criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./common.yaml#/components/responses/IdempotencyConflict"

  /v1/tenants/{tenant}/tables/{table}/records/{id}:
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Tenant"
      - name: table
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Id"
    get:
      operationId: getRecord
      summary: "Query: busca um registro por ID"
      responses:
        "200":
          description: registro encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          description: registro não encontrado (ou fora da visibilidade do ator — nunca distingue os dois casos na resposta)
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
    patch:
      operationId: updateRecord
      summary: "Command: atualiza campos de um registro"
      description: >
        Semântica de JSON Merge Patch (RFC 7396): campo ausente do corpo =
        sem alteração; campo presente com valor `null` = limpar o campo.
        Falha de versão otimista retorna 409.
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: registro atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "409":
          description: conflito de versão otimista ou de idempotência
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
    delete:
      operationId: deleteRecord
      summary: "Command: remove um registro"
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: removido
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./common.yaml#/components/responses/Forbidden"
        "404":
          description: já não existia (delete é idempotente)

components:
  securitySchemes:
    ServiceIdentity:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Identidade delegada ator+tenant entre BFF e backend Go (ADR-0003). O
        BFF assina um JWT de vida curta com claims `{sub (ator), tenant, iat,
        exp}`; o Go valida assinatura, expiração, e que o claim `tenant` bate
        com o tenant da URL (ver schema Tenant em common.yaml). Nunca aceitar
        tenant vindo de um header solto — GO-001 §2.1, "identidade não pode
        ser forjada por headers". Exemplos completos (positivo e dois
        negativos) em ../fixtures/identidade-delegada.md.

  schemas:
    Actor:
      type: object
      required: [id, role_id]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Id"
        role_id:
          type: integer
          description: Papel atual do ator (identity.RoleID) — nunca cacheado pelo chamador, sempre resolvido nesta consulta.

    TableInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        min_role_read:
          type: integer
        min_role_write:
          type: integer

    Table:
      type: object
      required: [id, name, min_role_read, min_role_write]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Id"
        name:
          type: string
        min_role_read:
          type: integer
        min_role_write:
          type: integer

    FieldInput:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [text, integer, boolean, float, date, key]
        required:
          type: boolean
        unique:
          type: boolean
        references:
          type: string
          description: Nome da tabela referenciada — obrigatório quando type=key.

    Field:
      type: object
      required: [id, table_id, name, type]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Id"
        table_id:
          $ref: "./common.yaml#/components/schemas/Id"
        name:
          type: string
        type:
          type: string
        required:
          type: boolean
        unique:
          type: boolean
        references_table_id:
          $ref: "./common.yaml#/components/schemas/Id"

    ViewInput:
      type: object
      required: [name, table, template, configuration]
      properties:
        name:
          type: string
        table:
          type: string
          description: Nome da tabela (não o id) que a view consulta.
        template:
          type: string
          description: Identificador de intenção (ex. "List", "Show") — armazenado, não interpretado nesta versão (a renderização é GO-020).
        configuration:
          type: object
          additionalProperties: true
          description: O documento de layout produzido pelo builder Craft.js (`craftToSaltcorn`, GO-018).
        min_role:
          type: integer

    ViewUpdateInput:
      type: object
      required: [_version]
      properties:
        _version:
          type: string
          description: O `_version` de uma leitura anterior — obrigatório, mesmo quando só min_role está sendo alterado (publicar também é uma escrita sujeita a conflito).
        configuration:
          type: object
          additionalProperties: true
        template:
          type: string
        min_role:
          type: integer

    View:
      type: object
      required: [id, name, table_id, template, min_role, configuration, _version]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Id"
        name:
          type: string
        table_id:
          $ref: "./common.yaml#/components/schemas/Id"
        template:
          type: string
        min_role:
          type: integer
        configuration:
          type: object
          additionalProperties: true
        _version:
          type: string

    ViewRenderColumn:
      type: object
      required: [field_name, header_label]
      properties:
        field_name:
          type: string
          description: Nome do campo (já resolvido contra o catálogo, GO-011) que esta coluna exibe.
        header_label:
          type: string

    ViewRenderPlan:
      type: object
      required: [view_id, columns, rows, order_by, descending]
      description: >
        DTO de renderização de uma view "List" (GO-020) — todas as decisões
        (colunas, ordenação, consulta) já foram tomadas pelo backend; o
        BFF/React só desenham o que está aqui.
      properties:
        view_id:
          $ref: "./common.yaml#/components/schemas/Id"
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ViewRenderColumn"
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        order_by:
          type: string
        descending:
          type: boolean
        next_cursor:
          type: ["string", "null"]
          description: Cursor para a próxima página, ou `null` se não houver mais páginas.

    RealtimeEvent:
      type: object
      required: [id, audience, payload]
      properties:
        id:
          type: integer
          format: int64
          description: Cursor de ordenação — sempre crescente na ordem de publicação (nunca reordenar por outro campo).
        audience:
          type: string
          enum: [broadcast, users]
          description: >
            Informativo — o BFF não precisa decidir roteamento por
            audience, a filtragem por destinatário já aconteceu no
            backend (ver `listRealtimeEvents`).
        payload:
          type: object
          additionalProperties: true
          description: Corpo opaco definido por quem publicou o evento (ex. internal/notify.Create) — o BFF reemite tal como está, nunca reinterpreta.

    RecordInput:
      type: object
      additionalProperties: true
      description: >
        Campos do registro conforme o schema dinâmico da tabela (GO-011).
        Este contrato não pode enumerar campos fixos — validação de schema
        acontece no backend, não aqui.

    Record:
      type: object
      required: [id, version, created_at]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Id"
        version:
          type: integer
          description: Versão otimista do registro (ADR-0001) — usada para detectar escrita concorrente.
        created_at:
          $ref: "./common.yaml#/components/schemas/DateTime"
        updated_at:
          $ref: "./common.yaml#/components/schemas/DateTime"
      additionalProperties: true
