openapi: 3.1.0
info:
  title: Saltcorn Go — convenções comuns
  version: "0.1.0"
  description: >
    Componentes reutilizados por internal-api.yaml (BFF → Go) e bff-api.yaml
    (React → BFF), via $ref. Este arquivo não é servido como API própria —
    tem `paths: {}` só para ser um documento OpenAPI válido por conta própria
    (lint independente). Ver ADR-0001 e ADR-0003 em ../../docs/migracao-go/adr/.
paths: {}
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Chave de idempotência escopada por tenant/ator/operação (ADR-0001).
        Requisições repetidas com a mesma chave e o mesmo payload retornam o
        resultado da primeira execução; a mesma chave com payload diferente é
        rejeitada com 409 (ver response IdempotencyConflict).
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor opaco da página anterior. Omitir para a primeira página.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  schemas:
    Id:
      type: integer
      format: int64
      description: >
        Identificador de registro. Limitação explícita desta versão do
        contrato: assume chave primária inteira simples — chaves compostas
        (risco já sinalizado na matriz de capacidades GO-001) ficam fora de
        escopo até uma revisão dedicada do contrato.

    DateTime:
      type: string
      format: date-time
      description: >
        Sempre UTC explícito (sufixo Z), nunca hora local implícita. Mitiga a
        classe de bug encontrada em GO-002 (2 falsos positivos de teste
        causados pelo timezone do host não ser UTC) — ver
        docs/migracao-go/baseline/GO-002-baseline.md §2.
      example: "2026-01-15T00:00:00Z"

    Decimal:
      type: string
      pattern: '^-?\d+(\.\d+)?$'
      description: >
        Números decimais trafegam como string, nunca como `number` JSON —
        evita perda de precisão de ponto flutuante (GO-001: "preservar
        decimal" listado na matriz de compatibilidade).
      example: "19.90"

    Tenant:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
      description: >
        Identificador de tenant. O BFF resolve o tenant por mapeamento
        confiável (host/subdomínio) e o inclui explicitamente na URL das
        chamadas ao backend Go — nunca é aceito de um header arbitrário do
        cliente final. Isso não basta sozinho: o backend Go valida
        independentemente que o claim `tenant` da identidade delegada
        (ver ServiceIdentity em internal-api.yaml) bate com este valor da
        URL, rejeitando com 403 (tenant_mismatch) quando não bater — defesa
        em profundidade, não confiança cega na URL.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: 'Código estável para tratamento programático (ex.: "invalid_identity_token").'
            message:
              type: string
              description: Mensagem legível; não é garantida estável entre versões do contrato.
            details:
              type: object
              additionalProperties: true
              description: "Contexto adicional opcional (ex.: qual campo era inválido)."

    Page:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {}
        next_cursor:
          type: ["string", "null"]
          description: Cursor para a próxima página, ou `null` se não houver mais páginas.

  responses:
    Unauthorized:
      description: Identidade ausente, expirada ou com assinatura inválida.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalid_signature:
              summary: "Negativo: token com assinatura inválida"
              value:
                error:
                  code: invalid_identity_token
                  message: "assinatura do token de identidade delegada não confere"

    Forbidden:
      description: Identidade válida, mas sem permissão para o recurso pedido.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            tenant_mismatch:
              summary: "Negativo: tenant do token não bate com o tenant da URL"
              value:
                error:
                  code: tenant_mismatch
                  message: "tenant do token de identidade não corresponde ao tenant do recurso"

    IdempotencyConflict:
      description: Mesma chave de idempotência usada com um payload diferente.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            payload_mismatch:
              summary: "Negativo: chave de idempotência reaproveitada com payload diferente"
              value:
                error:
                  code: idempotency_key_conflict
                  message: "Idempotency-Key já foi usada com um payload diferente"
