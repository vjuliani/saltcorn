openapi: 3.1.0
info:
  title: Saltcorn Go — API do BFF (React → BFF)
  version: "0.1.0"
  description: >
    Contrato consumido pelo frontend React (ADR-0002) através do BFF
    Node.js (ADR-0003). O BFF compõe estes recursos chamando internal-api.yaml
    do lado de trás; nunca acessa banco de domínio nem concentra regras de
    negócio. Mesmo recorte representativo de internal-api.yaml (registros
    dinâmicos) — ver nota de escopo em docs/migracao-go/execucoes/GO-006.md.
servers:
  - url: http://localhost:3100
    description: BFF Node.js local (a criar em GO-017)
security:
  - SessionCookie: []
    CsrfToken: []

paths:
  /api/bff/operator-session:
    post:
      operationId: exchangeOperatorTicket
      summary: Abre sessão administrativa com ticket emitido pela CLI local
      description: >
        Opcional, habilitado somente no pacote self-hosted. Ticket HS256 com
        audience saltcorn-cli-login, issuer da instalação e prazo máximo de
        60 segundos; uso único por processo. Revalida administrador no Go.
        Exige Content-Type JSON e Origin com o mesmo host da requisição.
        Não substitui autenticação de usuários finais nem aceita ServiceIdentity.
      security: []
      parameters:
        - name: Origin
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket]
              properties:
                ticket: {type: string}
      responses:
        "200":
          description: Sessão criada; cookies sc_session e sc_csrf emitidos
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ok]}
        "401":
          description: Ticket inválido, expirado, reutilizado ou administrador indisponível
        "403":
          description: Origem ou tipo de conteúdo inválido
        "404":
          description: Perfil self-hosted não habilitado
  /api/bff/sync/{table}/exchange:
    parameters:
      - name: table
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: exchangeOfflineSyncBff
      summary: Sincroniza alterações offline com conflitos explícitos e snapshot autorizado
      description: >
        GO-031, protocolo 1, independente do sync legado. Mesma operação/ID é
        idempotente; reutilizar ID com outro conteúdo retorna 409. Scope deve
        corresponder à sessão/identidade autenticada. Erros HTTP revertem o lote.
        Conflitos de registro retornam resultados explícitos em 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./sync.yaml#/components/schemas/Request"
      responses:
        "200":
          description: Resultados idempotentes e snapshot completo para persistência atômica local
          content:
            application/json:
              schema:
                $ref: "./sync.yaml#/components/schemas/Response"
        "400":
          description: Protocolo ou corpo inválido
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "401":
          description: Sessão ou identidade inválida
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "403":
          description: Scope, papel ou CSRF inválido
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "404":
          description: Tabela indisponível
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "409":
          description: Schema alterado ou ID reutilizado
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "413":
          description: Corpo ou snapshot acima do limite
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "502":
          description: Falha no domínio
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "503":
          description: Serviço indisponível
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"

  /api/bff/bootstrap:
    get:
      operationId: getBootstrap
      summary: Bootstrap do editor — metadados e permissões de interface (ADR-0003)
      security:
        - SessionCookie: []
      responses:
        "200":
          description: dados de bootstrap para a sessão atual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bootstrap"
        "401":
          $ref: "#/components/responses/SessionRequired"

  /api/bff/actor/language:
    patch:
      operationId: setActorLanguage
      summary: Define a preferência de idioma do ator autenticado (GO-047)
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                language:
                  type: string
                  description: Código de locale curto (ex. "pt", "en") ou "" para limpar a preferência.
      responses:
        "200":
          description: preferência atualizada — mesmo shape de Bootstrap.actor, mais `locale` (o idioma efetivo já recalculado)
          content:
            application/json:
              schema:
                type: object
                required: [actor, locale]
                properties:
                  actor:
                    type: object
                    properties:
                      id:
                        $ref: "./common.yaml#/components/schemas/Id"
                      role_id:
                        type: integer
                      language:
                        type: string
                  locale:
                    type: string
        "400":
          description: corpo inválido
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/SessionRequired"

  /api/bff/tables/{table}/records:
    parameters:
      - name: table
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listRecords
      summary: Lista registros (a UI não distingue papel/ownership — o backend Go já filtrou)
      security:
        - SessionCookie: []
      parameters:
        - $ref: "./common.yaml#/components/parameters/Cursor"
        - $ref: "./common.yaml#/components/parameters/Limit"
      responses:
        "200":
          description: página de registros, mesmo formato de internal-api.yaml `Page`
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Page"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "502":
          $ref: "#/components/responses/DomainUnavailable"
    post:
      operationId: createRecord
      summary: Cria um registro
      description: >
        O BFF gera e propaga a Idempotency-Key para a chamada interna
        correspondente; um retry do navegador (ex.: timeout percebido pelo
        usuário) reaproveita a mesma chave, não gera uma nova (ADR-0003:
        "retries de comandos exigem a mesma chave de idempotência").
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: registro criado
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "502":
          $ref: "#/components/responses/DomainUnavailable"

  /api/bff/tables:
    post:
      operationId: createTable
      summary: Cria uma tabela dinâmica (GO-019)
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: tabela criada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "502":
          $ref: "#/components/responses/DomainUnavailable"

  /api/bff/tables/{table}/fields:
    parameters:
      - name: table
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: addField
      summary: Adiciona um campo a uma tabela dinâmica (GO-019)
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name:
                  type: string
                type:
                  type: string
                required:
                  type: boolean
                unique:
                  type: boolean
                references:
                  type: string
      responses:
        "201":
          description: campo criado
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "502":
          $ref: "#/components/responses/DomainUnavailable"

  /api/bff/views:
    get:
      operationId: listViews
      summary: Lista views visíveis ao ator (GO-020)
      security:
        - SessionCookie: []
      parameters:
        - name: table
          in: query
          schema:
            type: string
      responses:
        "200":
          description: views visíveis ao ator
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/View"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "502":
          $ref: "#/components/responses/DomainUnavailable"
    post:
      operationId: createView
      summary: Cria uma view — o documento de layout do editor (GO-019)
      description: >
        O BFF gera e propaga a Idempotency-Key para a chamada interna,
        mesmo padrão de createRecord — um retry do editor reaproveita a
        mesma chave.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, table, template, configuration]
              properties:
                name:
                  type: string
                table:
                  type: string
                template:
                  type: string
                configuration:
                  type: object
                  additionalProperties: true
                min_role:
                  type: integer
      responses:
        "201":
          description: view criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/View"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "502":
          $ref: "#/components/responses/DomainUnavailable"

  /api/bff/views/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Id"
    get:
      operationId: getView
      summary: Reabre uma view (GO-019)
      security:
        - SessionCookie: []
      responses:
        "200":
          description: view encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/View"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "404":
          description: view não encontrada (ou fora da visibilidade do ator, nunca distingue os dois casos)
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/DomainUnavailable"
    patch:
      operationId: updateView
      summary: Salva ou publica uma view (GO-019)
      description: >
        Mesma operação para "salvar" (corpo com `configuration`) e
        "publicar" (corpo com `min_role` menor). Exige `_version` (de uma
        leitura anterior) — conflito de edição concorrente retorna 409,
        nunca sobrescreve silenciosamente.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [_version]
              properties:
                _version:
                  type: string
                configuration:
                  type: object
                  additionalProperties: true
                template:
                  type: string
                min_role:
                  type: integer
      responses:
        "200":
          description: view atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/View"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "409":
          description: "Negativo: conflito de edição concorrente — a view mudou desde a leitura"
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
              examples:
                conflito_de_edicao:
                  summary: "Negativo: outra sessão salvou primeiro"
                  value:
                    error:
                      code: version_conflict
                      message: "a view foi modificada por outra transação — releia e tente novamente"
        "422":
          description: "Negativo: layout incompatível com o runtime — só ao tentar publicar (GO-020)"
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
              examples:
                layout_incompativel:
                  summary: "Negativo: template/colunas fora do subconjunto suportado"
                  value:
                    error:
                      code: view_unsupported
                      message: "template \"Feed\" não suportado neste runtime (só \"List\", \"Show\", \"Edit\")"
        "502":
          $ref: "#/components/responses/DomainUnavailable"

  /api/bff/views/{id}/render:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Id"
    get:
      operationId: renderView
      summary: Renderiza uma view List, Show, Edit ou Feed (GO-020, estendido em GO-039/GO-051)
      description: >
        Devolve o DTO de internal-api.yaml, sem reinterpretar nada — o
        shape exato depende do template da view. `record` é obrigatório
        para Show (400 sem ele), opcional para Edit (ausente = registro
        novo), ignorado por List.
      security:
        - SessionCookie: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: cursor
          in: query
          schema:
            type: string
        - name: record
          in: query
          schema:
            $ref: "./common.yaml#/components/schemas/Id"
          description: Id do registro — obrigatório para Show, opcional para Edit, ignorado por List.
      responses:
        "200":
          description: plano de renderização — o shape exato depende do template da view
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ViewRenderPlan"
                  - $ref: "#/components/schemas/ViewShowPlan"
                  - $ref: "#/components/schemas/ViewEditPlan"
                  - $ref: "#/components/schemas/ViewFeedPlan"
        "400":
          description: "?record= ausente (template Show) ou inválido"
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "404":
          description: view ou registro não encontrado (ou fora da visibilidade do ator)
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "422":
          description: view existe, mas usa um recurso fora do subconjunto suportado por este runtime
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/DomainUnavailable"

  /api/bff/views/{id}/submit:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Id"
    post:
      operationId: submitView
      summary: "form_action — cria/atualiza um registro de uma view Edit (GO-039)"
      description: >
        O mecanismo real por trás do botão "Salvar"/"SubmitWithAjax" do
        legado. `record_id` ausente/0 cria; presente exige `_version` e
        atualiza, com o mesmo controle de concorrência otimista de
        qualquer outra escrita. Devolve o registro resultante e
        `navigate` — para onde ir depois ("reload", "referer" ou "view"
        com `view_name`).
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewSubmitInput"
      responses:
        "200":
          description: registro atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewSubmitResult"
        "201":
          description: registro criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewSubmitResult"
        "400":
          description: corpo inválido ou _version ausente ao atualizar
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "404":
          description: view ou registro não encontrado
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "409":
          description: "Negativo: conflito de versão otimista ou valor duplicado"
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
              examples:
                conflito_de_edicao:
                  summary: "Negativo: outra sessão salvou primeiro"
                  value:
                    error:
                      code: version_conflict
                      message: "o recurso foi modificado por outra transação — releia e tente novamente"
        "422":
          description: view existe, mas o layout ou os campos submetidos não são suportados
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/DomainUnavailable"

  /api/bff/views/{id}/rows/{recordId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Id"
      - name: recordId
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Id"
    delete:
      operationId: deleteViewRow
      summary: "Ação de coluna \"Delete\" de uma view List (GO-039)"
      security:
        - SessionCookie: []
          CsrfToken: []
      parameters:
        - name: version
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: linha excluída
        "400":
          description: "?version= ausente"
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "404":
          description: view ou registro não encontrado
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "409":
          description: conflito de versão otimista
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "422":
          description: view existe, mas não declara uma ação de coluna "Delete"
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/DomainUnavailable"

  /api/bff/workflows:
    get:
      operationId: listWorkflows
      summary: Lista workflows do tenant (GO-048)
      security:
        - SessionCookie: []
      responses:
        "200":
          description: workflows do tenant, em ordem de criação
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workflow"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "502":
          $ref: "#/components/responses/DomainUnavailable"
    post:
      operationId: createWorkflow
      summary: Cria um workflow, sem passo inicial (GO-048)
      description: >
        O BFF gera e propaga a Idempotency-Key para a chamada interna,
        mesmo padrão de createView.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: workflow criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "502":
          $ref: "#/components/responses/DomainUnavailable"

  /api/bff/workflows/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Id"
    get:
      operationId: getWorkflow
      summary: Reabre um workflow, com todos os seus passos (GO-048)
      security:
        - SessionCookie: []
      responses:
        "200":
          description: workflow encontrado, com seus passos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "404":
          description: workflow não encontrado
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/DomainUnavailable"
    patch:
      operationId: updateWorkflow
      summary: Renomeia e/ou muda o passo inicial de um workflow (GO-048)
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [_version]
              properties:
                _version:
                  type: string
                name:
                  type: string
                initial_step:
                  type: string
      responses:
        "200":
          description: workflow atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "409":
          description: "Negativo: conflito de edição concorrente — o workflow mudou desde a leitura"
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/DomainUnavailable"
    delete:
      operationId: deleteWorkflow
      summary: Remove um workflow e seus passos (GO-048)
      security:
        - SessionCookie: []
          CsrfToken: []
      responses:
        "204":
          description: workflow removido
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "404":
          description: workflow não encontrado
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/DomainUnavailable"

  /api/bff/workflows/{id}/steps:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Id"
    post:
      operationId: createWorkflowStep
      summary: Cria um passo novo no workflow (GO-048)
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowStepInput"
      responses:
        "201":
          description: passo criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowStep"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "404":
          description: workflow não encontrado
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "409":
          description: nome de passo duplicado neste workflow
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/DomainUnavailable"

  /api/bff/workflows/{id}/steps/{stepId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Id"
      - name: stepId
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Id"
    patch:
      operationId: updateWorkflowStep
      summary: "Reconfigura um passo, ou só reposiciona no canvas (GO-048)"
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowStepUpdateInput"
      responses:
        "200":
          description: passo atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowStep"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "404":
          description: passo não encontrado
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "409":
          description: conflito de edição concorrente
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/DomainUnavailable"
    delete:
      operationId: deleteWorkflowStep
      summary: Remove um passo (GO-048)
      security:
        - SessionCookie: []
          CsrfToken: []
      responses:
        "204":
          description: passo removido
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "404":
          description: passo não encontrado
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/DomainUnavailable"

  /api/bff/workflows/{id}/run:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Id"
    post:
      operationId: runWorkflow
      summary: Compila, inicia e roda o workflow até o fim (GO-048)
      description: >
        A prova ponta a ponta do critério de aceite de GO-048 — devolve o
        estado final síncrono (sem fila, sem polling). O BFF gera e
        propaga a Idempotency-Key: um duplo-clique no botão "Executar" do
        editor visual nunca inicia dois runs.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                context:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: >
            execução concluída (status "finished" ou "error" — um erro de
            domínio durante um passo aparece aqui, nunca como falha HTTP)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "404":
          description: workflow não encontrado
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "422":
          description: workflow sem passo inicial, ou definição com ação/passo desconhecido
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/DomainUnavailable"

  /api/bff/files:
    post:
      operationId: uploadFile
      summary: Envia um arquivo (multipart/form-data) (GO-051)
      description: >
        Repassa o multipart ao Go real, sem reinterpretar — o BFF só
        transporta a identidade delegada (mesmo padrão de todas as outras
        mutações). Upload PRIMEIRO (devolve um id), submissão do Edit
        DEPOIS (`updateView`-like `submit`, usando esse id como valor do
        campo).
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: arquivo salvo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "400":
          description: corpo multipart inválido, maior que o limite permitido, ou campo "file" ausente
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "502":
          $ref: "#/components/responses/DomainUnavailable"

  /api/bff/events/{eventname}:
    parameters:
      - name: eventname
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: emitEvent
      summary: Emite um evento nomeado, disparando os triggers correspondentes (GO-052)
      description: >
        O mecanismo Go por trás de `Trigger.emitEvent`/`POST
        /api/emit-event` do legado. O BFF gera e propaga a
        Idempotency-Key (mesmo padrão de runWorkflow) — um retry de rede
        nunca dispara os triggers duas vezes.
      security:
        - SessionCookie: []
          CsrfToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: evento despachado (fired=0 nunca é erro — só significa que nenhum trigger está registrado para este nome)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmitEventResult"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          description: CSRF inválido, ou este ator não tem permissão para emitir este nome de evento
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/DomainUnavailable"

  /manifest.json:
    get:
      operationId: getManifest
      summary: Manifesto PWA dinâmico do tenant self-hosted (GO-053)
      description: >
        Servido só em modo self-hosted (`selfHostedListener`, tenant fixo
        da instalação) — não existe, na topologia atual do BFF, um
        mecanismo de resolução de tenant a partir de uma requisição
        verdadeiramente anônima fora desse modo (toda rota autenticada
        resolve tenant a partir da SESSÃO, nunca do host/subdomínio),
        então servir isto no modo hospedado/multi-tenant genérico fica
        fora de escopo desta task — ver
        docs/migracao-go/execucoes/GO-053.md. Deliberadamente SEM
        segurança: um manifesto PWA é buscado pelo navegador antes de
        qualquer login existir.
      security: []
      responses:
        "200":
          description: manifesto PWA válido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PWAManifest"
        "502":
          $ref: "#/components/responses/DomainUnavailable"

  /api/bff/notifications/share-handler:
    post:
      operationId: shareHandler
      summary: Recebe conteúdo compartilhado via Web Share Target (GO-053)
      description: >
        O BFF calcula a Idempotency-Key (mesmo padrão de emitEvent) —
        nunca exigida do chamador, porque o POST nativo do Web Share
        Target do navegador não permite anexar cabeçalhos customizados.
        DELIBERADAMENTE sem CsrfToken pelo mesmo motivo (o navegador
        controla este POST via a API Web Share Target, não uma página
        desta aplicação com acesso ao cookie CSRF).
      security:
        - SessionCookie: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/ShareHandlerInput"
      responses:
        "200":
          description: conteúdo compartilhado despachado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmitEventResult"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "404":
          description: nenhum trigger ReceiveMobileShareData registrado neste tenant
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/DomainUnavailable"

  /api/bff/files/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "./common.yaml#/components/schemas/Id"
    get:
      operationId: downloadFile
      summary: Baixa os bytes de um arquivo (GO-051)
      security:
        - SessionCookie: []
      responses:
        "200":
          description: bytes do arquivo
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/SessionRequired"
        "404":
          description: arquivo não encontrado, ou ator sem acesso (deliberadamente indistinguíveis)
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/DomainUnavailable"

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: sc_session
      description: >
        Sessão de navegador, emitida e validada pelo BFF Node.js (ADR-0003).
        Nome e atributos do cookie fixados em ADR-0007 (HttpOnly, Secure,
        SameSite=Lax, 24h com renovação deslizante) — corrigido aqui de um
        nome de placeholder (`connect.sid`, padrão genérico de
        `express-session`) para o nome realmente decidido, GO-017 implementa
        exatamente este contrato. Nunca chega ao backend Go — o BFF troca a
        sessão por um token de ServiceIdentity (ver internal-api.yaml) antes
        de chamar o domínio.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Exigido em toda requisição de mutação (POST/PATCH/DELETE) autenticada por sessão de navegador.

  responses:
    SessionRequired:
      description: Sem sessão de navegador válida.
      content:
        application/json:
          schema:
            $ref: "./common.yaml#/components/schemas/Error"
          examples:
            sem_sessao:
              summary: "Negativo: sessão ausente/expirada"
              value:
                error:
                  code: session_required
                  message: "sessão de navegador ausente ou expirada"
    DomainUnavailable:
      description: >
        O backend Go não respondeu dentro do timeout, ou respondeu com erro
        de infraestrutura — a indisponibilidade do Go deve produzir um erro
        controlado na UI (ADR-0003), nunca travar a requisição indefinidamente.
      content:
        application/json:
          schema:
            $ref: "./common.yaml#/components/schemas/Error"
          examples:
            timeout:
              summary: "Negativo: backend Go indisponível/timeout"
              value:
                error:
                  code: domain_unavailable
                  message: "não foi possível completar a operação — tente novamente"
    CsrfInvalid:
      description: Token CSRF ausente ou inválido.
      content:
        application/json:
          schema:
            $ref: "./common.yaml#/components/schemas/Error"
          examples:
            csrf_invalido:
              summary: "Negativo: CSRF ausente/inválido"
              value:
                error:
                  code: csrf_invalid
                  message: "token CSRF ausente ou inválido"

  schemas:
    Bootstrap:
      type: object
      required: [actor, tenant, locale]
      properties:
        actor:
          type: object
          properties:
            id:
              $ref: "./common.yaml#/components/schemas/Id"
            role_id:
              type: integer
            language:
              type: string
              description: GO-047 — preferência de idioma EXPLÍCITA do usuário ("" = sem preferência, ver `locale` para o idioma EFETIVO já resolvido).
        tenant:
          $ref: "./common.yaml#/components/schemas/Tenant"
        locale:
          type: string
          description: >
            GO-047 — idioma EFETIVO já resolvido pelo BFF (`actor.language`
            > cookie `lang` > `default_locale` do tenant > `"pt"`), sempre
            preenchido — o frontend nunca precisa reimplementar essa
            cadeia de prioridade.

    View:
      type: object
      required: [id, name, table_id, template, min_role, configuration, _version]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Id"
        name:
          type: string
        table_id:
          $ref: "./common.yaml#/components/schemas/Id"
        template:
          type: string
        min_role:
          type: integer
        configuration:
          type: object
          additionalProperties: true
        _version:
          type: string

    Workflow:
      type: object
      required: [id, name, initial_step, _version]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Id"
        name:
          type: string
        initial_step:
          type: string
        _version:
          type: string
        steps:
          type: array
          description: Presente apenas em getWorkflow.
          items:
            $ref: "#/components/schemas/WorkflowStep"

    WorkflowStepInput:
      type: object
      required: [name, action_name]
      properties:
        name:
          type: string
        action_name:
          type: string
        configuration:
          type: object
          additionalProperties: true
        only_if:
          type: string
        next_step:
          type: string
        else_step:
          type: string
        error_step:
          type: string
        position_x:
          type: number
        position_y:
          type: number

    WorkflowStepUpdateInput:
      type: object
      required: [_version]
      properties:
        _version:
          type: string
        action_name:
          type: string
        configuration:
          type: object
          additionalProperties: true
        only_if:
          type: string
        next_step:
          type: string
        else_step:
          type: string
        error_step:
          type: string
        position_x:
          type: number
        position_y:
          type: number

    WorkflowStep:
      type: object
      required: [id, name, action_name, configuration, only_if, next_step, else_step, error_step, position_x, position_y, _version]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Id"
        name:
          type: string
        action_name:
          type: string
        configuration:
          type: object
          additionalProperties: true
        only_if:
          type: string
        next_step:
          type: string
        else_step:
          type: string
        error_step:
          type: string
        position_x:
          type: number
        position_y:
          type: number
        _version:
          type: string

    WorkflowRun:
      type: object
      required: [id, name, status, current_step, step_seq, context]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Id"
        name:
          type: string
        status:
          type: string
          enum: [running, finished, error]
        current_step:
          type: string
        step_seq:
          type: integer
        context:
          type: object
          additionalProperties: true
        error:
          type: string

    EmitEventResult:
      type: object
      required: [fired]
      properties:
        fired:
          type: integer

    ShareHandlerInput:
      type: object
      properties:
        title:
          type: string
        text:
          type: string
        url:
          type: string

    PWAManifestIcon:
      type: object
      required: [src, sizes]
      properties:
        src:
          type: string
        sizes:
          type: string
        type:
          type: string
        purpose:
          type: string

    PWAShareTarget:
      type: object
      required: [action, method, enctype, params]
      properties:
        action:
          type: string
        method:
          type: string
        enctype:
          type: string
        params:
          type: object
          required: [title, text, url]
          properties:
            title:
              type: string
            text:
              type: string
            url:
              type: string

    PWAManifest:
      type: object
      required: [name, start_url, display]
      properties:
        name:
          type: string
        start_url:
          type: string
        display:
          type: string
        icons:
          type: array
          items:
            $ref: "#/components/schemas/PWAManifestIcon"
        theme_color:
          type: string
        background_color:
          type: string
        share_target:
          $ref: "#/components/schemas/PWAShareTarget"

    ViewRenderColumn:
      type: object
      required: [kind]
      description: >
        Três variantes discriminadas por `kind`: "field" (campo direto),
        "join_field" (campo trazido por join — `field_name` é a chave
        composta "<campo_local>__<campo_remoto>", a MESMA chave usada em
        `rows`), "action" (ação de coluna — só `action_name`, sem
        `field_name`).
      properties:
        kind:
          type: string
          enum: [field, join_field, action]
        field_name:
          type: string
        header_label:
          type: string
        action_name:
          type: string

    ViewRenderPlan:
      type: object
      required: [view_id, columns, rows, order_by, descending]
      properties:
        view_id:
          $ref: "./common.yaml#/components/schemas/Id"
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ViewRenderColumn"
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        order_by:
          type: string
        descending:
          type: boolean
        next_cursor:
          type: ["string", "null"]
          description: Cursor para a próxima página, ou `null` se não houver mais páginas.

    ViewShowPlan:
      type: object
      required: [view_id, table, record_id, columns, values]
      properties:
        view_id:
          $ref: "./common.yaml#/components/schemas/Id"
        table:
          type: string
        record_id:
          $ref: "./common.yaml#/components/schemas/Id"
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ViewRenderColumn"
        values:
          type: object
          additionalProperties: true

    ViewEditFieldOption:
      type: object
      required: [id, label]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Id"
        label:
          type: string

    ViewEditField:
      type: object
      required: [field_name, label, field_type, fieldview, required, value]
      properties:
        field_name:
          type: string
        label:
          type: string
        field_type:
          type: string
        fieldview:
          type: string
        required:
          type: boolean
        config:
          type: object
          additionalProperties: true
        value: {}
        options:
          type: array
          items:
            $ref: "#/components/schemas/ViewEditFieldOption"

    ViewNestedEditPlan:
      type: object
      required: [view_id, view_name, child_table, fk_field, parent_id, rows]
      properties:
        view_id:
          $ref: "./common.yaml#/components/schemas/Id"
        view_name:
          type: string
        child_table:
          type: string
        fk_field:
          type: string
        parent_id:
          $ref: "./common.yaml#/components/schemas/Id"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ViewEditPlan"

    ViewEditPlan:
      type: object
      required: [view_id, table, record_id, fields, action_name]
      properties:
        view_id:
          $ref: "./common.yaml#/components/schemas/Id"
        table:
          type: string
        record_id:
          $ref: "./common.yaml#/components/schemas/Id"
        _version:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ViewEditField"
        action_name:
          type: string
        nested:
          type: array
          items:
            $ref: "#/components/schemas/ViewNestedEditPlan"

    ViewFeedCard:
      type: object
      required: [record_id, show]
      properties:
        record_id:
          $ref: "./common.yaml#/components/schemas/Id"
        show:
          $ref: "#/components/schemas/ViewShowPlan"

    ViewFeedPlan:
      type: object
      required: [view_id, table, cards]
      properties:
        view_id:
          $ref: "./common.yaml#/components/schemas/Id"
        table:
          type: string
        cards:
          type: array
          items:
            $ref: "#/components/schemas/ViewFeedCard"
        view_to_create_id:
          $ref: "./common.yaml#/components/schemas/Id"
        view_to_create_name:
          type: string
        next_cursor:
          type: ["string", "null"]

    File:
      type: object
      required: [id, filename, mime_super, mime_sub, size_bytes]
      properties:
        id:
          $ref: "./common.yaml#/components/schemas/Id"
        filename:
          type: string
        mime_super:
          type: string
        mime_sub:
          type: string
        size_bytes:
          type: integer

    ViewSubmitInput:
      type: object
      required: [values]
      properties:
        record_id:
          $ref: "./common.yaml#/components/schemas/Id"
        _version:
          type: string
        values:
          type: object
          additionalProperties: true

    ViewNavigate:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [reload, referer, view]
        view_name:
          type: string

    ViewSubmitResult:
      type: object
      required: [record, navigate]
      properties:
        record:
          type: object
          additionalProperties: true
        navigate:
          $ref: "#/components/schemas/ViewNavigate"
