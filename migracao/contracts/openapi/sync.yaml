openapi: 3.1.0
info:
  title: Saltcorn offline sync components
  version: "1.0.0"
paths: {}
components:
  schemas:
    Scope:
      type: object
      additionalProperties: false
      required: [tenant, actor, table]
      properties:
        tenant: {type: string, minLength: 1}
        actor: {type: string, minLength: 1}
        table: {type: string, minLength: 1}
    Mutation:
      type: object
      additionalProperties: false
      required: [id, kind]
      properties:
        id:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,128}$'
          description: Identificador imutável de uma tentativa. Resolver conflito exige novo ID.
        kind: {type: string, enum: [create, update, delete]}
        row_id: {type: integer, minimum: 1}
        base_version:
          type: string
          maxLength: 128
          description: Obrigatório em update/delete; token recebido na leitura original.
        values: {type: object, additionalProperties: true}
    Request:
      type: object
      additionalProperties: false
      required: [protocol, scope, client_id, schema_version, checkpoint, mutations]
      properties:
        protocol: {type: integer, const: 1}
        scope: {$ref: '#/components/schemas/Scope'}
        client_id: {type: string, pattern: '^[A-Za-z0-9_-]{1,128}$'}
        schema_version: {type: integer, minimum: 0}
        checkpoint:
          type: string
          maxLength: 128
          description: Hash do último snapshot gravado localmente; vazio no bootstrap. Não é cursor incremental.
        mutations:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Mutation'}
    Result:
      type: object
      required: [id, status]
      properties:
        id: {type: string}
        status: {type: string, enum: [applied, conflict, rejected]}
        code: {type: string}
        row_id: {type: integer}
    Response:
      type: object
      required: [protocol, scope, schema_version, fields, checkpoint, results, rows]
      properties:
        protocol: {type: integer, const: 1}
        scope: {$ref: '#/components/schemas/Scope'}
        schema_version: {type: integer, minimum: 0}
        fields:
          type: array
          items:
            type: object
            required: [name, type, required]
            properties:
              name: {type: string}
              type: {type: string, enum: [text, integer, boolean, float, date, key]}
              required: {type: boolean}
        checkpoint: {type: string}
        results:
          type: array
          items: {$ref: '#/components/schemas/Result'}
        rows:
          type: array
          maxItems: 2000
          description: >
            Substituição completa e autorizada da tabela. Ausência representa exclusão
            ou perda de acesso; o cliente preserva rascunhos pendentes separadamente.
            Sem paginação parcial: se exceder 2000 linhas, toda a transação falha com 413.
          items:
            type: object
            required: [id, _version]
            properties:
              id: {type: integer}
              _version: {type: string}
            additionalProperties: true
