name: saltcorn-migracao-local
services:
  postgres:
    image: postgres:16
    env_file: .state/postgres.env
    ports:
      - '127.0.0.1:${SALTCORN_LOCAL_PG_PORT:-55436}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U saltcorn_local -d saltcorn_local']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
