name: saltcorn-migracao-docker
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: saltcorn_local
      POSTGRES_DB: saltcorn_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Use docker.sh up}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U saltcorn_local -d saltcorn_local']
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    build:
      context: ../..
      dockerfile: migracao/local/docker/Dockerfile
      target: app
    init: true
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Use docker.sh up}
    volumes:
      - instance-data:/data
    ports:
      - '127.0.0.1:${HTTP_PORT:-5180}:8080'
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 35s
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3100/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      start_period: 40s
      retries: 20
  frontend:
    build:
      context: ../..
      dockerfile: migracao/local/docker/Dockerfile
      target: frontend
    # Share only networking: the supervisor keeps Go and BFF on loopback.
    network_mode: service:app
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/readyz']
      interval: 3s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
  instance-data:
